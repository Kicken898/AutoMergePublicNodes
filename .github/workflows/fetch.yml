name: Fetch Nodes

on:
  schedule:
    - cron: '0 */12 * * *'   # 每12小时运行一次
  workflow_dispatch:          # 允许手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch script
        env:
          NO_PROXY: ${{ secrets.NO_PROXY }}        # 可选
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}     # 可选
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}   # 可选
        run: python fetch.py

      # 🔧 修复：只添加存在的文件，避免因缺失文件而失败
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 逐个添加可能生成的文件，如果文件不存在则忽略错误
          git add list.txt || true
          git add list.yml || true
          git add list.meta.yml || true
          git add list_raw.txt || true
          git add list.result.csv || true
          # 如果有其他生成的文件，可继续添加
          git add *.json || true   # 有些项目会生成 JSON 文件
          # 检查是否有任何更改，有则提交
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update nodes"
          git push
